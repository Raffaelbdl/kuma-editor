<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'none'" />
    <title>kuma</title>
    <link rel="stylesheet" href="launcher.css" />
  </head>
  <body>
    <div id="app">
      <aside id="side">
        <div class="brand">
          <span class="dot"></span>
          <div>
            <div class="brand-name">kuma</div>
            <div class="brand-sub muted">hybrid video editor</div>
          </div>
        </div>
        <div id="actions"></div>
        <div class="spacer"></div>
        <div id="env" class="muted"></div>
      </aside>
      <main id="main"></main>
    </div>
    <div id="drop-hint"><div>Drop a <span class="mono">.kuma.json</span> to open it</div></div>
    <script type="module" src="launcher.js"></script>
  </body>
</html>
