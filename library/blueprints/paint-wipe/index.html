<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script src="_vendor/gsap.min.js"></script>
    <script src="_vendor/kuma.js"></script>
    <script src="_vendor/rough.min.js"></script>
    <script src="_vendor/kuma-canvas.js"></script>
    <link rel="stylesheet" href="_vendor/kuma.css" />
    <style>
      canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="1.2" data-width="1920" data-height="1080">
      <div class="clip" data-start="0" data-duration="1.2" style="position:absolute;inset:0">
        <canvas id="paint"></canvas>
      </div>
    </div>
    <script>
      const { vars, width, height, duration, timeline } = kumaTemplate({
        color: "#d97757", color2: "#a84d33", direction: "right", strokes: 5, roughness: 1.6, texture: true, size: 1,
      });
      const { clamp, lerp, ease, easeOut, hash } = kumaCanvas;
      const ANGLE = { right: 0, left: Math.PI, up: -Math.PI / 2, down: Math.PI / 2 };
      const tl = timeline();

      // Strokes cover the frame by the midpoint (p 0 → .5), then drag off (.5 → 1). The
      // frame is measured along the sweep and across it, so portrait is covered too.
      kumaCanvas(tl, "#paint", (g, t) => {
        const p = t / duration;
        if (p <= 0 || p >= 1) return;
        const { ctx, w, h, u } = g, n = Math.round(vars.strokes), a = ANGLE[vars.direction] - 0.1;
        const along = Math.abs(w * Math.cos(a)) + Math.abs(h * Math.sin(a));
        const across = Math.abs(w * Math.sin(a)) + Math.abs(h * Math.cos(a));
        const half = along / 2, edge = 0.06 * along, band = across / n + 0.04 * across;
        ctx.translate(w / 2, h / 2);
        ctx.rotate(a);
        for (let i = 0; i < n; i++) {
          const y0 = -across / 2 - 0.02 * across + (i * across) / n, d = 0.3 * hash(`delay${i}`);
          const q = p < 0.5 ? easeOut(clamp((p * 2 - d) / (1 - d))) : ease(clamp(((p - 0.5) * 2 - d) / (1 - d)));
          const x0 = p < 0.5 ? -half - edge : lerp(-half - edge, half + edge, q);
          const x1 = p < 0.5 ? lerp(-half - edge, half + edge, q) : half + edge;
          if (x1 - x0 < edge / 2) continue;
          // A ragged end on the leading edge, and on the trailing one while it drags off.
          const rag = (k) => edge * (0.5 + 0.5 * g.rand(`rag${i}-${k}`));
          const pts = [];
          for (let k = 0; k <= 8; k++) pts.push([lerp(x0, x1, k / 8), y0 + Math.sin(k * 0.9 + i) * 0.012 * across]);
          for (let k = 1; k < 9; k++) pts.push([x1 + rag(k) - edge, y0 + (band * k) / 9]);
          for (let k = 8; k >= 0; k--) pts.push([lerp(x0, x1, k / 8), y0 + band + Math.sin(k * 0.8 + i * 2) * 0.012 * across]);
          if (p >= 0.5) for (let k = 8; k > 0; k--) pts.push([x0 - rag(k + 20) + edge, y0 + (band * k) / 9]);
          const [a, b] = i % 2 ? [vars.color2, vars.color] : [vars.color, vars.color2];
          const r = g.rough(`stroke${i}`);
          r.polygon(pts, { fill: a, fillStyle: "solid", stroke: "transparent", roughness: vars.roughness });
          if (vars.texture) {
            r.polygon(pts, { fill: b, fillStyle: "hachure", hachureAngle: -41, hachureGap: 1.6 * u, fillWeight: 0.25 * u, stroke: "transparent", roughness: vars.roughness });
          }
        }
      }, { width, height, duration, size: vars.size });
    </script>
  </body>
</html>
