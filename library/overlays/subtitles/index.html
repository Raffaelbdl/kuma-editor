<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script src="_vendor/gsap.min.js"></script>
    <script src="_vendor/kuma.js"></script>
    <link rel="stylesheet" href="_vendor/kuma.css" />
    <style>
      .subs { position: absolute; left: calc(var(--var-at-x) * 100%); top: calc(var(--var-at-y) * 100%);
              transform: translate(-50%, -50%); width: 88%; display: grid; place-items: center; }
      /* Every cue sits in the same grid cell; the timeline shows one at a time. */
      .cue { grid-area: 1 / 1; max-width: 100%; text-align: center; opacity: 0; will-change: transform, opacity;
             font: 800 calc(4 * var(--u)) / 1.15 "Segoe UI", system-ui, sans-serif; color: var(--var-color);
             padding: calc(0.6 * var(--u)) calc(1.4 * var(--u)); border-radius: calc(0.8 * var(--u)); }
      .box .cue { background: color-mix(in srgb, var(--var-background) 82%, transparent); }
      .outline .cue { -webkit-text-stroke: calc(0.22 * var(--u)) var(--var-background); paint-order: stroke fill; }
      .outline .cue, .plain .cue { text-shadow: 0 calc(0.15 * var(--u)) calc(0.6 * var(--u)) rgba(0, 0, 0, 0.6); }
      .upper .cue { text-transform: uppercase; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="10" data-width="1920" data-height="1080">
      <div id="subs" class="clip subs" data-start="0" data-duration="10"></div>
    </div>
    <script>
      const { vars, duration, timeline } = kumaTemplate({
        cues: [{ start: 0.2, end: 1.6, text: "Subtitles go here" }, { start: 1.8, end: 3.6, text: "one line at a time" }],
        offset: 0, at: { x: 0.5, y: 0.78 }, size: 1, color: "#ffffff", background: "#111111", style: "box", uppercase: false,
      });
      const subs = document.getElementById("subs");
      subs.classList.add(vars.style);
      subs.classList.toggle("upper", !!vars.uppercase);

      // One paused timeline, a pop-in at each cue's start and a cut at its end, in clip
      // time (source time minus the offset). Cues outside the clip are not even mounted.
      const tl = timeline();
      for (const cue of vars.cues || []) {
        const start = Math.max(0, cue.start - vars.offset), end = Math.min(duration, cue.end - vars.offset);
        if (!(end > start)) continue;
        const el = document.createElement("div");
        el.className = "cue";
        el.textContent = cue.text;
        subs.appendChild(el);
        tl.fromTo(el, { opacity: 0, scale: 0.85 }, { opacity: 1, scale: 1, duration: Math.min(0.12, end - start), ease: "back.out(2)" }, start);
        tl.set(el, { opacity: 0 }, end);
      }
      // Span the whole clip, so a seek past the last cue lands on an empty stage.
      tl.to({}, { duration: 0 }, duration);
    </script>
  </body>
</html>
