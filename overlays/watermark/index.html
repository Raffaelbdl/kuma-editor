<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script src="_vendor/kuma.js"></script>
    <link rel="stylesheet" href="_vendor/kuma.css" />
    <style>
      .wm { position: absolute; margin: calc(3 * var(--u)); padding: calc(0.8 * var(--u)) calc(1.4 * var(--u));
            font: 600 calc(2.4 * var(--u))/1 "Segoe UI", system-ui, sans-serif; color: #fff; opacity: var(--var-opacity);
            background: rgba(0,0,0,0.35); border-radius: calc(0.6 * var(--u)); letter-spacing: 0.02em; }
      .wm.top-left { left: 0; top: 0; } .wm.top-right { right: 0; top: 0; }
      .wm.bottom-left { left: 0; bottom: 0; } .wm.bottom-right { right: 0; bottom: 0; }
    </style>
  </head>
  <body>
    <!-- data-no-timeline: no GSAP timeline here, so the renderer must not wait for one. -->
    <div id="root" data-composition-id="main" data-no-timeline data-start="0" data-duration="10" data-width="1920" data-height="1080">
      <div id="wm" class="clip wm bottom-right" data-start="0" data-duration="10">@kuma</div>
    </div>
    <script>
      const { vars, text } = kumaTemplate({ text: "@kuma", corner: "bottom-right", opacity: 0.6, size: 1 });
      text("wm", vars.text).className = `clip wm ${vars.corner}`;
      // Static template: no timeline (see data-no-timeline on the root). The bake takes one frame.
    </script>
  </body>
</html>
