<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>kuma</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ccircle cx='8' cy='8' r='7' fill='%23ff4f00'/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <!-- Two modes over one set of panels (`panelhost.ts`): **power**, the panels docked
         around the frame, and **den**, the frame full-bleed with panels summoned over it.
         A panel is a module; which container it is in — docked, floating, or a window of
         its own (`?panel=<id>`) — is view state, never the document. -->
    <div id="app">
      <!-- Only drawn in the desktop shell, where the window has no frame of its own. -->
      <div id="titlebar"></div>
      <header id="topbar"></header>
      <main id="main">
        <nav id="rail"></nav>
        <aside id="side" class="slot"></aside>
        <!-- The centre is tabbed (the tabs are in the top bar): the sequence monitor, and
             an overlay workbench per overlay entry being iterated on. One is shown at a
             time; both stay mounted. -->
        <section id="center">
          <div id="stages">
            <section id="preview"></section>
            <section id="workbench"></section>
          </div>
          <div id="transport"></div>
        </section>
        <aside id="right" class="slot"></aside>
      </main>
      <footer id="bottom" class="slot"></footer>
      <div id="statusline"></div>
      <div id="den"></div>
      <div id="floating"></div>
      <!-- Panels not on screen stay mounted here, so their subscriptions and listeners live
           on and summoning one again costs nothing. -->
      <div id="parking" hidden></div>
      <div id="toasts"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
